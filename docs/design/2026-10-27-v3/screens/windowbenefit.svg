<text x="58" y="92.80000000000001" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="28" font-weight="600" fill="#17243A" text-anchor="start">这个功能适合我吗？</text>
<text x="24" y="125.3" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="13" font-weight="400" fill="#56657C" text-anchor="start">允许时间弹性的人，可以自愿尝试</text>
<rect x="24" y="157" width="364" height="103" rx="16" fill="#E9EEFF" stroke="none" stroke-width="1"/>
<text x="40" y="186.4" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="14" font-weight="600" fill="#355EDB" text-anchor="start">价值：给提醒增加时点变化</text>
<text x="40" y="209.2" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#17243A" text-anchor="start">在你允许的范围内随机开始一次；与随机音乐可以分别选择。</text>
<rect x="24" y="302" width="364" height="78" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="40" y="334.6" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="16" font-weight="600" fill="#17243A" text-anchor="start">不会检测睡眠阶段</text>
<text x="40" y="357.2" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#56657C" text-anchor="start">窗口随机不代表浅睡眠唤醒</text>
<rect x="24" y="392" width="364" height="78" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="40" y="424.6" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="16" font-weight="600" fill="#17243A" text-anchor="start">效果仍需观察</text>
<text x="40" y="447.2" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#56657C" text-anchor="start">目前不能承诺减少漏听或更容易起床</text>
<rect x="24" y="482" width="364" height="78" rx="16" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="40" y="514.6" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="16" font-weight="600" fill="#17243A" text-anchor="start">保持可接受的最晚时刻</text>
<text x="40" y="537.2" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#56657C" text-anchor="start">例如08:10仍来得及，再使用08:00–08:10</text>
<text x="24" y="631.5" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="15" font-weight="400" fill="#56657C" text-anchor="start">可以对照固定08:05与随机08:00–08:10的使用感受；</text>
<text x="24" y="653.25" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="15" font-weight="400" fill="#56657C" text-anchor="start">记录只做描述，不自动改变作息。</text>
