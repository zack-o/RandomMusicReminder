<text x="40" y="411.4" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="14" font-weight="600" fill="#91601F" text-anchor="start">停止声音，不代表已经起床</text>
<text x="40" y="434.2" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#17243A" text-anchor="start">固定补充采用什么确认条件，必须在开启时说明。主提醒和补</text>
<text x="40" y="451.59999999999997" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#17243A" text-anchor="start">充同一分钟会合并播放。</text>
