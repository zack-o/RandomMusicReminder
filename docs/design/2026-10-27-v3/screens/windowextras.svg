<text x="76" y="212.2" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#56657C" text-anchor="start">用户手动延后才追加，可超出原窗口</text>
<text x="368" y="188.3" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="13" font-weight="400" fill="#355EDB" text-anchor="end">关闭</text>
