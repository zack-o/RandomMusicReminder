<text x="368" y="566.3" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="13" font-weight="400" fill="#355EDB" text-anchor="end">严格一次</text>
<text x="24" y="679.4" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="14" font-weight="400" fill="#56657C" text-anchor="start">启用后摘要会改为“1次主提醒＋额外提醒”，不会继续承</text>
<text x="24" y="699.6999999999999" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="14" font-weight="400" fill="#56657C" text-anchor="start">诺总共只响一次。</text>
