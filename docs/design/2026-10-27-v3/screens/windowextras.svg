<text x="76" y="312.2" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="12" font-weight="400" fill="#56657C" text-anchor="start">例如08:10仍未明确确认起床时追加</text>
<text x="368" y="288.3" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="13" font-weight="400" fill="#355EDB" text-anchor="end">关闭</text>
